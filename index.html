<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TimeColourStamp</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TimeColourStamp">

  <link rel="apple-touch-icon" href="icon.png">
  
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-main: #000000;
      --text-sub: #8e8e93;
      --border-color: #e5e5ea;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-user-select: none;
      user-select: none;
    }
    header {
      background: var(--card-bg);
      padding: 20px 16px 10px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .clock {
      font-size: 3rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      margin: 0;
    }
    .date-display {
      font-size: 1.1rem;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      padding-bottom: 8px;
    }
    .stamp-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.1);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      outline: none;
      transition: transform 0.1s;
    }
    .stamp-btn:active {
      transform: scale(0.9);
    }
    .btn-red { background-color: #ff3b30; }
    .btn-orange { background-color: #ff9500; }
    .btn-green { background-color: #34c759; }
    .btn-gray { background-color: #8e8e93; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }
    .tool-btn {
      background: none;
      border: none;
      color: #007aff;
      font-size: 1rem;
      cursor: pointer;
    }

    .list-container {
      padding: 0 0 40px 0;
    }
    
    /* アコーディオン・日付ヘッダー関連 */
    .date-header {
      display: flex;
      align-items: center;
      padding: 12px 16px 6px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text-sub);
    }
    .header-title-area {
      display: flex;
      align-items: center;
      flex: 1;
      cursor: pointer;
    }
    .accordion-icon {
      margin-right: 8px;
      font-size: 0.75rem;
      transition: transform 0.2s;
      display: inline-block;
    }
    .accordion-icon.collapsed {
      transform: rotate(-90deg); /* ▼を▶にする */
    }

    /* 選択モード用チェックボックス */
    .checkbox-container {
      width: 32px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .checkbox-container input {
      width: 20px;
      height: 20px;
      margin: 0;
      pointer-events: none; /* クリック判定は親要素に任せる */
    }

    .record-item {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }
    .record-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .record-time {
      font-size: 1.1rem;
      width: 80px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .record-memo {
      flex: 1;
      font-size: 0.95rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .record-elapsed {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      box-sizing: border-box;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .color-select-container {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 12px 0 20px 0;
    }
    .color-select-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      box-sizing: border-box;
    }
    .start-checkbox-container {
      margin-bottom: 16px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    textarea {
      width: 100%;
      height: 100px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
      resize: none;
    }
    #exportArea {
      height: 350px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.4;
      white-space: pre;
    }
  </style>
</head>
<body>

  <header>
    <div class="clock" id="clock">00:00:00</div>
    <div class="date-display" id="dateDisplay">----年--月--日</div>
    <div class="btn-container">
      <button class="stamp-btn btn-red" onclick="addRecord('red')"></button>
      <button class="stamp-btn btn-orange" onclick="addRecord('orange')"></button>
      <button class="stamp-btn btn-green" onclick="addRecord('green')"></button>
      <button class="stamp-btn btn-gray" onclick="addRecord('gray')"></button>
    </div>
  </header>

  <!-- 通常時のツールバー -->
  <div class="toolbar" id="normalTools">
    <button class="tool-btn" onclick="toggleSelectMode()">選択</button>
    <div>
      <button class="tool-btn" style="margin-right: 16px;" onclick="openExportModal()">出力</button>
      <button class="tool-btn" style="color:#ff3b30;" onclick="clearAllRecords()">全削除</button>
    </div>
  </div>

  <!-- 選択モード時のツールバー -->
  <div class="toolbar" id="selectTools" style="display: none; background-color: #f2f2f7;">
    <button class="tool-btn" onclick="toggleSelectMode()">キャンセル</button>
    <button class="tool-btn" style="color:#ff3b30; font-weight:bold;" id="deleteSelectedBtn" onclick="deleteSelected()">削除 (0)</button>
  </div>

  <div class="list-container" id="listContainer"></div>

  <!-- 詳細・メモ入力モーダル -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin:0;">詳細設定</h3>
        <button class="tool-btn" onclick="saveDetail()">完了</button>
      </div>
      <p id="modalTimeText" style="color:var(--text-sub); margin-top:0; margin-bottom:8px;"></p>
      
      <div class="color-select-container">
        <div class="color-select-btn btn-red" id="mc-red" onclick="selectModalColor('red')"></div>
        <div class="color-select-btn btn-orange" id="mc-orange" onclick="selectModalColor('orange')"></div>
        <div class="color-select-btn btn-green" id="mc-green" onclick="selectModalColor('green')"></div>
        <div class="color-select-btn btn-gray" id="mc-gray" onclick="selectModalColor('gray')"></div>
      </div>

      <label class="start-checkbox-container">
        <input type="checkbox" id="isStartCheckbox" style="width:18px; height:18px;">
        この打刻を開始基準にする
      </label>

      <textarea id="memoInput" placeholder="メモを入力..."></textarea>
      
      <div style="margin-top: 16px; text-align: right;">
        <button class="tool-btn" style="color:#ff3b30;" onclick="deleteCurrentRecord()">この記録を削除</button>
      </div>
    </div>
  </div>

  <!-- 出力モーダル -->
  <div class="modal" id="exportModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin:0;">テキスト出力</h3>
        <button class="tool-btn" onclick="closeExportModal()">閉じる</button>
      </div>
      <textarea id="exportArea" readonly></textarea>
      <div style="margin-top: 12px;">
        <button class="tool-btn" style="width:100%; padding:10px; background:#007aff; color:#fff; border-radius:8px;" onclick="copyExportText()">テキストをコピー</button>
      </div>
    </div>
  </div>

  <script>
    let records = JSON.parse(localStorage.getItem('TCS_records') || '[]');
    let currentEditingId = null;
    let tempSelectedColor = '';
    
    // 追加: 状態管理用変数
    let collapsedDays = new Set(); // 折り畳まれている日付キーを保存
    let isSelectMode = false;      // 選択モード中かどうか
    let selectedIds = new Set();   // 選択されているレコードIDを保存

    // 時計の更新
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const dateStr = `${now.getFullYear()}年${('0'+(now.getMonth()+1)).slice(-2)}月${('0'+now.getDate()).slice(-2)}日 (${days[now.getDay()]})`;
      document.getElementById('dateDisplay').textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function saveToStorage() {
      localStorage.setItem('TCS_records', JSON.stringify(records));
      renderList();
    }

    function addRecord(color) {
      const isFirst = records.length === 0;
      const newRec = {
        id: Date.now().toString(),
        timestamp: Date.now(),
        color: color,
        memo: '',
        isStart: isFirst
      };
      records.unshift(newRec);
      saveToStorage();
    }

    // --- 追加: アコーディオン・選択モードのロジック ---
    function toggleAccordion(dayKey) {
      if (collapsedDays.has(dayKey)) {
        collapsedDays.delete(dayKey);
      } else {
        collapsedDays.add(dayKey);
      }
      renderList();
    }

    function toggleSelectMode() {
      isSelectMode = !isSelectMode;
      selectedIds.clear(); // モード切替時に選択をリセット
      updateToolbar();
      renderList();
    }

    function updateToolbar() {
      const normalTools = document.getElementById('normalTools');
      const selectTools = document.getElementById('selectTools');
      if (isSelectMode) {
        normalTools.style.display = 'none';
        selectTools.style.display = 'flex';
        document.getElementById('deleteSelectedBtn').textContent = `削除 (${selectedIds.size})`;
      } else {
        normalTools.style.display = 'flex';
        selectTools.style.display = 'none';
      }
    }

    function toggleSelection(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateToolbar();
      renderList();
    }

    function toggleDaySelection(dayKey, items) {
      // その日の記録がすべて選択されているか確認
      const allSelected = items.every(i => selectedIds.has(i.rec.id));
      if (allSelected) {
        // すべて選択済みなら、すべて解除
        items.forEach(i => selectedIds.delete(i.rec.id));
      } else {
        // そうでなければ、すべて選択
        items.forEach(i => selectedIds.add(i.rec.id));
      }
      updateToolbar();
      renderList();
    }

    function deleteSelected() {
      if (selectedIds.size === 0) return;
      if (confirm(`${selectedIds.size}件の記録を削除しますか？\nこの操作は元に戻せません。`)) {
        records = records.filter(r => !selectedIds.has(r.id));
        selectedIds.clear();
        isSelectMode = false;
        updateToolbar();
        saveToStorage();
      }
    }
    // ---------------------------------------------

    // リスト描画（改修）
    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      const grouped = {};
      const days = ['日', '月', '火', '水', '木', '金', '土'];

      records.forEach((rec, idx) => {
        const d = new Date(rec.timestamp);
        const dayKey = `${d.getFullYear()}年${('0'+(d.getMonth()+1)).slice(-2)}月${('0'+d.getDate()).slice(-2)}日 (${days[d.getDay()]})`;
        if (!grouped[dayKey]) grouped[dayKey] = [];
        grouped[dayKey].push({ rec, globalIdx: idx });
      });

      for (const [dayKey, items] of Object.entries(grouped)) {
        const header = document.createElement('div');
        header.className = 'date-header';

        // 選択モード中のみ、ヘッダー左側に一括選択チェックボックスを表示
        if (isSelectMode) {
          const cbContainer = document.createElement('div');
          cbContainer.className = 'checkbox-container';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          // 全て選択されているかチェック
          cb.checked = items.every(i => selectedIds.has(i.rec.id));
          cb.style.pointerEvents = 'none';
          
          cbContainer.onclick = (e) => {
            e.stopPropagation();
            toggleDaySelection(dayKey, items);
          };
          cbContainer.appendChild(cb);
          header.appendChild(cbContainer);
        }

        // アコーディオン操作用のテキスト領域
        const headerTitleArea = document.createElement('div');
        headerTitleArea.className = 'header-title-area';
        headerTitleArea.onclick = () => toggleAccordion(dayKey);
        
        const icon = document.createElement('span');
        icon.className = 'accordion-icon ' + (collapsedDays.has(dayKey) ? 'collapsed' : '');
        icon.textContent = '▼';
        
        const titleText = document.createElement('span');
        titleText.textContent = dayKey;
        
        headerTitleArea.appendChild(icon);
        headerTitleArea.appendChild(titleText);
        header.appendChild(headerTitleArea);

        container.appendChild(header);

        // --- 折り畳み状態なら中身（アイテム）を描画せずにスキップ ---
        if (collapsedDays.has(dayKey)) {
          continue;
        }

        items.forEach(({ rec, globalIdx }) => {
          const itemEl = document.createElement('div');
          itemEl.className = 'record-item';

          // モードによってタップ時の動作を変更
          if (isSelectMode) {
            itemEl.onclick = () => toggleSelection(rec.id);
            
            const cbContainer = document.createElement('div');
            cbContainer.className = 'checkbox-container';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = selectedIds.has(rec.id);
            cb.style.pointerEvents = 'none';
            cbContainer.appendChild(cb);
            itemEl.appendChild(cbContainer);
          } else {
            itemEl.onclick = () => openDetailModal(rec.id);
          }

          const dot = document.createElement('div');
          dot.className = `record-dot btn-${rec.color}`;

          const timeEl = document.createElement('div');
          timeEl.className = 'record-time';
          const d = new Date(rec.timestamp);
          timeEl.textContent = d.toTimeString().split(' ')[0].substring(0, 5);

          const memoEl = document.createElement('div');
          memoEl.className = 'record-memo';
          memoEl.textContent = rec.memo || '';

          const elapsedEl = document.createElement('div');
          elapsedEl.className = 'record-elapsed';
          
          let startRecord = null;
          if (rec.isStart) {
            elapsedEl.textContent = '開始';
          } else {
            for (let i = globalIdx + 1; i < records.length; i++) {
              if (records[i].isStart) {
                startRecord = records[i];
                break;
              }
            }
            if (!startRecord && records.length > 0) {
              startRecord = records[records.length - 1];
            }

            if (startRecord && startRecord !== rec) {
              const diffSec = Math.floor((rec.timestamp - startRecord.timestamp) / 1000);
              const hh = String(Math.floor(diffSec / 3600)).padStart(2, '0');
              const mm = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
              const ss = String(diffSec % 60).padStart(2, '0');
              elapsedEl.textContent = `+${hh}:${mm}:${ss}`;
            } else {
              elapsedEl.textContent = '開始';
            }
          }

          itemEl.appendChild(dot);
          itemEl.appendChild(timeEl);
          itemEl.appendChild(memoEl);
          itemEl.appendChild(elapsedEl);
          container.appendChild(itemEl);
        });
      }
    }

    // --- その他既存機能（詳細モーダル、出力など） ---
    function openDetailModal(id) {
      currentEditingId = id;
      const rec = records.find(r => r.id === id);
      if (!rec) return;
      
      const d = new Date(rec.timestamp);
      document.getElementById('modalTimeText').textContent = `${d.toLocaleString('ja-JP')} の記録`;
      document.getElementById('memoInput').value = rec.memo || '';
      document.getElementById('isStartCheckbox').checked = !!rec.isStart;
      
      selectModalColor(rec.color);
      document.getElementById('detailModal').style.display = 'flex';
    }

    function selectModalColor(color) {
      tempSelectedColor = color;
      const colors = ['red', 'orange', 'green', 'gray'];
      colors.forEach(c => {
        const el = document.getElementById('mc-' + c);
        if (c === tempSelectedColor) {
          el.style.border = '3px solid #007aff';
          el.style.transform = 'scale(1.1)';
        } else {
          el.style.border = '2px solid rgba(0,0,0,0.1)';
          el.style.transform = 'scale(1)';
        }
      });
    }

    function saveDetail() {
      const rec = records.find(r => r.id === currentEditingId);
      if (rec) {
        rec.memo = document.getElementById('memoInput').value;
        rec.color = tempSelectedColor;
        rec.isStart = document.getElementById('isStartCheckbox').checked;
        saveToStorage();
      }
      document.getElementById('detailModal').style.display = 'none';
    }

    function deleteCurrentRecord() {
      if (confirm('この記録を削除しますか？')) {
        records = records.filter(r => r.id !== currentEditingId);
        saveToStorage();
        document.getElementById('detailModal').style.display = 'none';
      }
    }

    function clearAllRecords() {
      if (confirm('すべての記録を削除しますか？\nこの操作は元に戻せません。')) {
        records = [];
        saveToStorage();
      }
    }

    function openExportModal() {
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const colorMap = { red: 'R', orange: 'O', green: 'G', gray: 'N' };
      let text = '';
      records.forEach(r => {
        const d = new Date(r.timestamp);
        const y = d.getFullYear();
        const m = ('0'+(d.getMonth()+1)).slice(-2);
        const date = ('0'+d.getDate()).slice(-2);
        const day = days[d.getDay()];
        const time = d.toTimeString().split(' ')[0];
        const c = colorMap[r.color] || '-';
        
        text += `[${y}/${m}/${date}(${day}) ${time}](${c})`;
        if (r.memo) {
          text += ` ${r.memo}`;
        }
        text += '\n';
      });
      document.getElementById('exportArea').value = text;
      document.getElementById('exportModal').style.display = 'flex';
    }

    function closeExportModal() {
      document.getElementById('exportModal').style.display = 'none';
    }

    function copyExportText() {
      const area = document.getElementById('exportArea');
      area.select();
      navigator.clipboard.writeText(area.value);
      alert('クリップボードにコピーしました');
    }

    renderList();
  </script>
</body>
</html>
